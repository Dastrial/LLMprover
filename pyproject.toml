[project]
name = "llmprover"
version = "0.1.0"
description = "Rocq theorem proving demonstrator driven by an LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "openai>=3.3",
    "anthropic>=0.40",
    "mistralai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bench = [
    "datasets>=2.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmprover*"]

[tool.setuptools.package-data]
llmprover = [
    "prover_agents/prompts/*.txt",
    "prover_agents/prompts/**/*.txt",
    "prompts/*.txt",
    "prompts/history/*.txt",
]
